<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Subtle Blueprint Grid lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />

    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Hexagon badge shield -->
  <polygon points="256,60 410,140 410,340 256,430 102,340 102,140" fill="#1e293b" fill-opacity="0.8" stroke="url(#primaryGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Construction Building / Architecture icon silhouette -->
  <g fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Crane & tower outline -->
    <path d="M190,340 L190,170 L256,120 L322,170 L322,340" />
    <line x1="190" y1="220" x2="322" y2="220" />
    <line x1="190" y1="275" x2="322" y2="275" />
    <line x1="256" y1="120" x2="256" y2="340" />
  </g>

  <!-- Big Stylized "PM" Monogram -->
  <text x="256" y="315" font-family="'Be Vietnam Pro', system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">PM</text>

  <!-- Subtitle badge: PROJECTM -->
  <rect x="146" y="365" width="220" height="42" rx="21" fill="url(#primaryGrad)" />
  <text x="256" y="392" font-family="'Be Vietnam Pro', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">PROJECT-M</text>
</svg>

